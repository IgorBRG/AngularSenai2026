<div class="d-flex vh-100 bg-light">

  <!-- Menu lateral igual ao da Home para manter padrão -->
  <div class="sidebar d-flex flex-column p-3 bg-white shadow-sm border-end" style="width: 250px;">
    <div class="text-center mb-4 mt-4">
      <img src="/img/ford.png" alt="Ford Logo" style="width: 100px;">
    </div>
    
    <ul class="nav nav-pills flex-column mb-auto mt-2">
      <li class="nav-item mb-2">
        <a routerLink="/home" class="nav-link text-dark">
          <i class="bi bi-house-door me-2"></i> Home
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link active bg-light text-success fw-bold" aria-current="page">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
    </ul>

    <hr>
    
    <button class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center" (click)="fazerLogout()" title="Sair do sistema">
      <i class="bi bi-box-arrow-right me-2"></i> Logout
    </button>
  </div>

  <!-- Conteúdo Principal do Dashboard -->
  <div class="flex-grow-1 p-4 overflow-auto text-center">
    <h3 class="text-primary fw-bold mb-5" style="color: #0b5ed7 !important;">Dashboard FORD</h3>

    <!-- Linha de cartões (Passo 8 e Passo 9) -->
    <div class="d-flex justify-content-center gap-4 mb-5 flex-wrap">
      
      <!-- Passo 8: Cartão com campo de busca (Select) por nome do modelo do veículo -->
      <div class="card shadow-sm border-secondary" style="width: 220px;">
        <div class="card-header bg-white border-bottom-0 pt-3 pb-0 text-start">
          <span class="text-muted fw-bold" style="font-size: 14px;">Veículo</span>
        </div>
        <div class="card-body">
          <select 
            class="form-select border-primary text-primary fw-bold" 
            [formControl]="searchControl"
          >
            <option value="" disabled selected>Selecione...</option>
            <option *ngFor="let veiculo of todosVeiculos" [value]="veiculo.vehicle">
              {{ veiculo.vehicle }}
            </option>
          </select>
        </div>
      </div>

      <!-- Passo 9: Cartão Total de Vendas -->
      <div class="card shadow-sm border-secondary" style="width: 220px;">
        <div class="card-header bg-white border-bottom-0 pt-3 pb-2 text-start">
          <span class="text-muted fw-bold" style="font-size: 14px;">Total de Vendas</span>
        </div>
        <div class="card-body text-start pt-0">
          <h3 class="text-info fw-bold m-0" style="color: #0dcaf0 !important;">{{ veiculoSelecionado?.volumetotal || 0 }}</h3>
          <span class="text-muted small">Unid.</span>
        </div>
      </div>

      <!-- Passo 9: Cartão Conectados -->
      <div class="card shadow-sm border-secondary" style="width: 220px;">
        <div class="card-header bg-white border-bottom-0 pt-3 pb-2 text-start">
          <span class="text-muted fw-bold" style="font-size: 14px;">Conectados</span>
        </div>
        <div class="card-body text-start pt-0">
          <h3 class="text-info fw-bold m-0" style="color: #0dcaf0 !important;">{{ veiculoSelecionado?.connected || 0 }}</h3>
          <span class="text-muted small">Unid.</span>
        </div>
      </div>

      <!-- Passo 9: Cartão Update Software -->
      <div class="card shadow-sm border-secondary" style="width: 220px;">
        <div class="card-header bg-white border-bottom-0 pt-3 pb-2 text-start">
          <span class="text-muted fw-bold" style="font-size: 14px;">Update Software</span>
        </div>
        <div class="card-body text-start pt-0">
          <h3 class="text-info fw-bold m-0" style="color: #0dcaf0 !important;">{{ veiculoSelecionado?.softwareUpdates || 0 }}</h3>
          <span class="text-muted small">Unid.</span>
        </div>
      </div>

    </div>

    <!-- Área da Imagem do Carro (já estava aqui, mas agora fica logo abaixo dos cartões) -->
    <div class="text-center" *ngIf="veiculoSelecionado" style="margin-bottom: 40px;">
      <img [src]="veiculoSelecionado.img" alt="Imagem do veículo" style="max-width: 500px; width: 100%;">
    </div>

  </div>
</div>
