<div class="d-flex vh-100 bg-light">

  <!-- Menu lateral igual ao da Home para manter padrão -->
  <div class="sidebar d-flex flex-column p-3 bg-white shadow-sm border-end" style="width: 250px;">
    <div class="text-center mb-4 mt-4">
      <img src="/img/ford.png" alt="Ford Logo" style="width: 100px;">
    </div>
    
    <ul class="nav nav-pills flex-column mb-auto mt-2">
      <li class="nav-item mb-2">
        <a routerLink="/home" class="nav-link text-dark">
          <i class="bi bi-house-door me-2"></i> Home
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link active bg-light text-success fw-bold" aria-current="page">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
    </ul>

    <hr>
    
    <button class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center" (click)="fazerLogout()" title="Sair do sistema">
      <i class="bi bi-box-arrow-right me-2"></i> Logout
    </button>
  </div>

  <!-- Conteúdo Principal do Dashboard -->
  <div class="flex-grow-1 p-4 overflow-auto">
    <h3 class="text-primary fw-bold text-center mb-4">Dashboard FORD</h3>

    <!-- Passo 8: Cartão com campo de busca por nome do modelo do veículo -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row align-items-center">
          <div class="col-md-4">
            <label class="form-label text-muted fw-bold">Veículo</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-muted"></i>
              </span>
              <!-- Campo de busca interligado com nosso searchControl criado no TS -->
              <input 
                type="text" 
                class="form-control border-start-0 ps-0 shadow-none" 
                placeholder="Buscar veículo..." 
                [formControl]="searchControl"
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista de veículos filtrados (Apenas para visualização de que a busca funciona) -->
    <div class="row">
      <div class="col-md-3 mb-3" *ngFor="let veiculo of veiculosFiltrados">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body text-center">
            <h5 class="card-title text-primary">{{ veiculo.vehicle }}</h5>
            <img [src]="veiculo.img" alt="{{ veiculo.vehicle }}" class="img-fluid my-2" style="max-height: 100px;">
            <p class="text-muted small mb-0">VIN: {{ veiculo.vin }}</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
